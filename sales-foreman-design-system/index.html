              if (c.id === commentId) {
                return { ...c, replies: [...(c.replies || []), replyObj] };

              return c;

            return { ...p, comments: updatedCmts };

                    title: fd.get('title'),
                    clientName: fd.get('clientName'),
                    clientPhone: fd.get('clientPhone'),
                    location: fd.get('location'),
                    budget: Number(fd.get('budget')),
                    description: fd.get('description'),
                    startDate: fd.get('startDate'),
                    targetDate: fd.get('targetDate'),
                    attachments: []
                  };
                  handleCreateProject(projectData);
                }} className="p-6 space-y-4">
                  
                  <div>
                    <label className="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">ชื่อโครงการ / หัวข้องาน *</label>
                    <input name="title" required placeholder="เช่น ปรับปรุงภายในบ้าน 2 ชั้น เอกมัย" className="w-full px-3 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl text-sm dark:text-white" />
                  </div>

                  <div className="grid grid-cols-2 gap-4">
                    <div>
                      <label className="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">ชื่อลูกค้า / บริษัท *</label>
                      <input name="clientName" required placeholder="คุณสมเกียรติ" className="w-full px-3 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl text-sm dark:text-white" />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">เบอร์โทรติดต่อ *</label>
                      <input name="clientPhone" required placeholder="081-000-0000" className="w-full px-3 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl text-sm dark:text-white" />
                    </div>
                  </div>

                  <div className="grid grid-cols-3 gap-3">
                    <div>
                      <label className="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">งบประมาณ (บาท) *</label>
                      <input name="budget" type="number" required placeholder="500000" className="w-full px-3 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl text-sm dark:text-white" />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">วันเริ่มเข้างาน *</label>
                      <input name="startDate" type="date" defaultValue="2026-08-01" required className="w-full px-3 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl text-sm dark:text-white" />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">กำหนดส่งมอบ *</label>
                      <input name="targetDate" type="date" defaultValue="2026-09-30" required className="w-full px-3 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl text-sm dark:text-white" />
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">สถานที่หน้างาน</label>
                    <input name="location" placeholder="เอกมัย ซอย 10 กรุงเทพฯ" className="w-full px-3 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl text-sm dark:text-white" />
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">รายละเอียดและเงื่อนไขงาน</label>
                    <textarea name="description" rows="3" placeholder="รายละเอียดความต้องการของลูกค้า..." className="w-full px-3 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl text-sm dark:text-white"></textarea>
                  </div>

                  <div className="pt-4 border-t border-slate-200 dark:border-slate-800 flex justify-end space-x-3">
                    <button type="button" onClick={() => setIsNewProjectModalOpen(false)} className="px-4 py-2 bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-300 rounded-xl text-sm font-semibold">
                      ยกเลิก
                    </button>
                    <button type="submit" className="px-5 py-2 bg-sky-600 hover:bg-sky-700 text-white rounded-xl text-sm font-semibold">
                      เปิดโครงการใหม่
                    </button>
                  </div>

                </form>
              </div>
            </div>
          )}

          {/* ADVANCE STAGE MODAL */}
          {advanceStageTarget && (
            <div className="fixed inset-0 z-50 bg-slate-950/60 backdrop-blur-xs flex items-center justify-center p-4">
              <div className="bg-white dark:bg-slate-900 w-full max-w-lg rounded-2xl shadow-2xl overflow-hidden animate-modal border border-slate-200 dark:border-slate-800">
                <div className="bg-indigo-900 text-white p-5 flex justify-between items-center">
                  <h2 className="text-base font-bold flex items-center">
                    <i data-lucide="arrow-right-circle" className="w-5 h-5 mr-2 text-indigo-400"></i>
                    อนุมัติส่งต่อขั้นตอนงาน: {STAGES[advanceStageTarget.nextStage].name}
                  </h2>
                  <button onClick={() => setAdvanceStageTarget(null)} className="text-indigo-300 hover:text-white">
                    <i data-lucide="x" className="w-5 h-5"></i>
                  </button>
                </div>

                <form onSubmit={(e) => {
                  e.preventDefault();
                  const fd = new FormData(e.target);
                  const noteText = fd.get('note');
                  const fileInput = e.target.querySelector('input[type="file"]');
                  let newFile = null;

                  if (fileInput && fileInput.files[0]) {
                    const file = fileInput.files[0];
                    const isPdf = file.type.includes('pdf');
                    newFile = {
                      id: 'att_' + Date.now(),
                      fileName: file.name,
                      fileType: isPdf ? 'pdf' : 'image',
                      fileCategory: `02_Design`,
                      folderCategory: `02_Design`,
                      uploadedBy: `${currentUser.name} (${currentUser.roleName})`,
                      uploadDate: new Date().toLocaleString('th-TH'),
                      url: URL.createObjectURL(file),
                      size: (file.size / (1024 * 1024)).toFixed(2) + ' MB'
                    };
                  }

                  handleAdvanceStage(advanceStageTarget.project.id, advanceStageTarget.nextStage, noteText, newFile);
                }} className="p-5 space-y-4">
                  
                  <p className="text-xs text-slate-600 dark:text-slate-300">
                    คุณกำลังจะส่งต่อโครงการ <strong>"{advanceStageTarget.project.title}"</strong> ไปยังขั้นตอน 
                    <span className="font-bold text-indigo-600 dark:text-indigo-400"> {STAGES[advanceStageTarget.nextStage].name}</span>
                  </p>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">บันทึกข้อความ / หมายเหตุส่งต่อ</label>
                    <textarea name="note" rows="3" placeholder="ระบุสิ่งที่ส่งมอบให้ทีมถัดไป..." className="w-full px-3 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl text-sm dark:text-white"></textarea>
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">แนบไฟล์อนุมัติ (PDF หรือ รูปภาพ) - ถ้ามี</label>
                    <input type="file" accept="image/*,application/pdf" className="w-full text-xs text-slate-500 file:mr-3 file:py-2 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-indigo-50 dark:file:bg-indigo-950 file:text-indigo-700 dark:file:text-indigo-300" />
                  </div>

                  <div className="pt-4 border-t border-slate-200 dark:border-slate-800 flex justify-end space-x-3">
                    <button type="button" onClick={() => setAdvanceStageTarget(null)} className="px-4 py-2 bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-300 rounded-xl text-sm font-semibold">
                      ยกเลิก
                    </button>
                    <button type="submit" className="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-sm font-semibold">
                      ยืนยันส่งต่อขั้นตอน
                    </button>
                  </div>

                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
